name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            rpm \
            file

      - name: Install frontend deps
        run: npm ci

      - name: Frontend unit tests (vitest)
        run: npm run test

      - name: Frontend build (vite)
        run: npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Build app bundles (tauri build)
        # NO_STRIP avoids linuxdeploy's stale strip failing on newer
        # `.relr.dyn` sections (Fedora/Ubuntu 24.04+).
        env:
          NO_STRIP: 1
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: little-tasks-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: error
